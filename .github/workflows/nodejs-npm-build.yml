name: nodejs-npm-build

on:
  workflow_call:
    inputs:
      domain:
        required: true
        type: string
      need_a6:
        required: false
        type: boolean
        default: false
      comments:
        required: false
        type: string
        default: "comments"

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # If your repository depends on submodule, please see: https://github.com/actions/checkout
          submodules: recursive
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          # hexo 8 依赖 strip-ansi@7（纯 ESM），需要支持 require(esm) 的 Node：
          # >=20.19 或 >=22.12；22.4.1 会 FATAL: ERR_REQUIRE_ESM
          node-version: "24"
      - name: Cache NPM dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.OS }}-npm-cache
          restore-keys: |
            ${{ runner.OS }}-npm-cache
      - name: Install Dependencies
        run: npm install
      - name: Build
        env:
          A2: ${{ secrets.A2 }}
          A3: ${{ secrets.A3 }}
          A4: ${{ secrets.A4 }}
          A5: ${{ secrets.A5 }}
        run: |
          chmod +x prepare.sh
          if [ "${{ inputs.need_a6 }}" = "true" ]; then
            ./prepare.sh ${{ inputs.domain }} "$A2" "$A3" "$A4" "$A5" '${{ secrets.A6 }}' "${{ inputs.comments }}"
          else
            ./prepare.sh ${{ inputs.domain }} "$A2" "$A3" "$A4" "$A5" "" "${{ inputs.comments }}"
          fi
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 0
          name: public-dir
          path: public
          overwrite: true